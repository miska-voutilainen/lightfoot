name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check lightfoot tests scripts bench
      - run: ruff format --check lightfoot tests scripts bench

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --cov=lightfoot --cov-report=term --cov-fail-under=80

  test-without-orjson:
    # The standard-library JSON fallback must keep working for installs without the `fast` extra.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" && python -m pip uninstall -y orjson
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install . pip-audit bandit
      - name: Known vulnerabilities in dependencies
        run: pip-audit --skip-editable
      - name: Static security scan
        run: bandit -q -r lightfoot -ll

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The wheel installs and runs on its own
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/lightfoot --version
          /tmp/wheel-check/bin/python -c "import lightfoot.server, lightfoot.adapters.responses, lightfoot.prune"
