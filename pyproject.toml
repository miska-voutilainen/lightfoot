[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightfoot"
dynamic = ["version"]
description = "A local, cache-aware token-saving proxy for coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miska" }]
requires-python = ">=3.11"
keywords = ["claude", "claude-code", "anthropic", "proxy", "prompt-caching", "tokens", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "httpx>=0.27",
    # About 2x less CPU per request on long sessions; lightfoot falls back to the standard library without it.
    "orjson>=3.10; platform_python_implementation == 'CPython'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://github.com/miska-voutilainen/lightfoot"
Issues = "https://github.com/miska-voutilainen/lightfoot/issues"

[project.scripts]
lightfoot = "lightfoot.cli:main"

[tool.setuptools.packages.find]
include = ["lightfoot*"]

[tool.setuptools.package-data]
lightfoot = ["data/*.toml", "data/skills/*/SKILL.md"]  # model prices, provider facts, agent skills

[tool.setuptools.dynamic]
version = { attr = "lightfoot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "S", "PERF", "RUF", "I",
          "D100", "D101", "D102", "D103", "D104", "D106"]  # every public module, class and function has a docstring
ignore = [
    "RUF001", "RUF002", "RUF003",  # "…", "→", "≈" in messages are intentional
    "S404", "S603", "S607",        # subprocess use was reviewed: argument lists, resolved executables
    "SIM105",                      # explicit try/except/pass reads better for best-effort cleanup
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "E501", "E731", "PERF401",  # fixtures are long literals
             "D1"]  # test names say what they check

[tool.coverage.run]
source = ["lightfoot"]
omit = ["lightfoot/__main__.py"]

[tool.coverage.report]
show_missing = false
skip_covered = true
