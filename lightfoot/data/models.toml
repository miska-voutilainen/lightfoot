# Model and provider facts that change whenever a provider ships something.
#
# Edit this file, not the code, when a model launches, a price changes or a beta header is
# renamed. Take every number from the provider's own page, and update `checked` for what you
# read. `lightfoot doctor` warns when the newest date here is more than 60 days old.
#
# Prices are USD per million tokens, as listed on each provider's standard-tier price page.
# Users can override or add models in their own config under [prices]; that wins over this file.

prices_as_of = "2026-10-26"

# --- Sources ---------------------------------------------------------------------------

[sources.anthropic]
page = "Anthropic standard-tier price page"
checked = "2026-10-06"
note = "cache writes 1.25x (5 min) / 2x (1 h); reads 0.1x unless listed"

[sources.openai]
page = "OpenAI standard-tier price page"
checked = "2026-10-25"
note = """cache writes 1.25x (30 min) / 2.5x (12 h) on the gpt-5.6 and gpt-6 families; older models \
list no cache-write price, so writes are billed as plain input"""

[sources.gemini]
page = "Google Gemini API price page"
checked = "2026-10-22"
note = """implicit caching bills no writes; cached reads at the listed rate (0.1x). Announced \
increases (gemini-4-argon from 2026-12-01, the 3.6 and 3.8 Flash models from 2027-01-01) are not \
applied yet"""

[sources.xai]
page = "xAI models and pricing page (docs.x.ai/docs/models)"
checked = "2026-10-26"
note = """automatic prompt caching, no cache-write charge; once a prompt reaches 200K tokens, every token in the request bills at the long-context rate"""

[sources.deepseek]
page = "DeepSeek models and pricing page (api-docs.deepseek.com/quick_start/pricing)"
checked = "2026-10-26"
note = """automatic context caching, no cache-write charge. Rows hold the off-peak rates; peak hours (01:00-04:00 and 06:00-10:00 UTC, Monday to Friday) bill double, which this file can't express"""

# --- Unknown models --------------------------------------------------------------------
# An unknown Claude, OpenAI or Gemini model is priced like its family's default model and
# flagged in stats. Any other family gets no price: its savings are reported in tokens.

[fallbacks]
anthropic = "claude-opus-5-5"
openai = "gpt-6-sol"
gemini = "gemini-2.5-pro"  # Gemini CLI's default model

