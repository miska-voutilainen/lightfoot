<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 154" width="744" height="154" role="img" aria-labelledby="title"><title id="title">The fail-safe ladder: rewrite, then stored rewrites only, then the original</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1f2328; }
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
  .muted { fill: #59636e; }
  .accent { fill: #0969da; }
  .box { fill: none; stroke: #59636e; }
  .box-accent { fill: none; stroke: #0969da; }
  .frame { fill: none; stroke: #8c959f; stroke-dasharray: 4 3; }
  .line { stroke: #59636e; fill: none; }
  .line-accent { stroke: #0969da; fill: none; }
  .faint { stroke: #d0d7de; fill: none; }
  .head { fill: #59636e; }
  .head-accent { fill: #0969da; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .accent { fill: #4493f8; }
    .box { stroke: #9198a1; }
    .box-accent { stroke: #4493f8; }
    .frame { stroke: #656c76; }
    .line { stroke: #9198a1; }
    .line-accent { stroke: #4493f8; }
    .faint { stroke: #3d444d; }
    .head { fill: #9198a1; }
    .head-accent { fill: #4493f8; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box-accent" x="10" y="20" width="212" height="52" rx="2" stroke-width="1.5"/><text x="116.0" y="43.0" font-size="13" font-weight="600" text-anchor="middle" class="accent">1. rewrite</text><text x="116.0" y="60.0" font-size="11.5" font-weight="400" text-anchor="middle" class="muted">stored + new rewrites</text><path class="line-accent" d="M116,72 L116,112" stroke-width="1.25" marker-end="url(#aa)"/><text x="124" y="96" font-size="11" font-weight="400" text-anchor="start" class="muted">accepted</text><path class="line" d="M222,46 L264,46" stroke-width="1.25" marker-end="url(#a)"/><text x="243" y="39" font-size="11" font-weight="400" text-anchor="middle" class="muted">400</text><rect class="box" x="266" y="20" width="212" height="52" rx="2" stroke-width="1"/><text x="372.0" y="43.0" font-size="13" font-weight="600" text-anchor="middle">2. stored rewrites only</text><text x="372.0" y="60.0" font-size="11.5" font-weight="400" text-anchor="middle" class="muted">new ones rolled back</text><path class="line" d="M372,72 L372,112" stroke-width="1.25" marker-end="url(#a)"/><text x="380" y="96" font-size="11" font-weight="400" text-anchor="start" class="muted">accepted</text><path class="line" d="M478,46 L520,46" stroke-width="1.25" marker-end="url(#a)"/><text x="499" y="39" font-size="11" font-weight="400" text-anchor="middle" class="muted">400</text><rect class="box" x="522" y="20" width="212" height="52" rx="2" stroke-width="1"/><text x="628.0" y="43.0" font-size="13" font-weight="600" text-anchor="middle">3. the original request</text><text x="628.0" y="60.0" font-size="11.5" font-weight="400" text-anchor="middle" class="muted">session goes passthrough</text><path class="line" d="M628,72 L628,112" stroke-width="1.25" marker-end="url(#a)"/><text x="636" y="96" font-size="11" font-weight="400" text-anchor="start" class="muted">accepted</text><rect class="box" x="10" y="114" width="724" height="30" rx="2" stroke-width="1"/><text x="372" y="134" font-size="12.5" font-weight="400" text-anchor="middle">the response streams back to the agent, unchanged</text></svg>
