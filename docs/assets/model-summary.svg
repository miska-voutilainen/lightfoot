.5" font-weight="400" text-anchor="start" class="muted">stored as a pending prune</text><path class="line" d="M82.0,240 L376.0,240" stroke-width="1.25" marker-end="url(#a)"/><text x="230.0" y="234" font-size="11.5" font-weight="400" text-anchor="middle">request at prompt N+1</text><path class="line-accent" d="M382.0,274 L676.0,274" stroke-width="1.25" marker-end="url(#aa)"/><text x="530.0" y="268" font-size="11.5" font-weight="400" text-anchor="middle" class="accent">block + messages[boundary:], beta header added</text></svg>
